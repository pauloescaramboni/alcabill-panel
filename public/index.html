<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALCABILL — Painel</title>
<meta name="theme-color" content="#202020" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700;800&family=Jost:wght@400&display=swap" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<div id="tela-login" class="tela-login">
  <form id="form-login" class="cartao-login">
    <img class="logo-login" src="/logo.png" alt="ALCABILL" />
    <p class="meta subtitulo-login">Painel de controle de etiquetas eletrônicas</p>
    <label for="login-email">E-mail</label>
    <input id="login-email" type="email" autocomplete="username" required />
    <label for="login-senha">Senha</label>
    <input id="login-senha" type="password" autocomplete="current-password" required />
    <button class="botao" type="submit">Entrar</button>
    <div class="erro oculto" id="login-erro"></div>
  </form>
</div>

<div id="app" class="oculto">
  <div class="topo">
    <div class="marca-topo">
      <h1>ALCABILL</h1>
    </div>
    <div class="acoes-topo">
      <span class="meta usuario-topo" id="usuario-nome"></span>
      <nav class="dock-topo" aria-label="Ações da conta">
        <button type="button" id="btn-usuarios" class="botao-icone oculto" aria-label="Usuários" title="Usuários">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="12" cy="7.5" r="4.25"/><path d="M4 21a8 7.25 0 0 1 16 0z"/></svg>
        </button>
        <button type="button" id="btn-trocar-senha" class="botao-icone" aria-label="Trocar senha" title="Trocar senha">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M10.5 9.6V6.75a4.25 4.25 0 0 0-8.5 0V8.5"/><path fill="currentColor" fill-rule="evenodd" d="M14 8a7 7 0 1 1 0 14a7 7 0 1 1 0-14zM13 12.6a1 1 0 0 1 2 0v4.8a1 1 0 0 1-2 0z"/></svg>
        </button>
        <button type="button" id="btn-logout" class="botao-icone botao-sair" aria-label="Sair" title="Sair">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8.5 6.4a7.25 7.25 0 1 0 7 0"/><path d="M12 3.25v8"/></svg>
        </button>
      </nav>
    </div>
  </div>

  <div class="container">
    <div id="resumo" class="resumo"></div>
    <div class="campo-busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="search" id="busca" aria-label="Buscar etiquetas" placeholder="Buscar por produto, código, serial ou localização..." />
    </div>
    <div class="barra-acoes">
      <button class="botao pequeno" id="btn-nova-etiqueta">+ Nova etiqueta</button>
      <button class="botao pequeno secundario" id="btn-novo-produto">+ Novo produto</button>
      <label class="check"><input type="checkbox" id="chk-offline" /> mostrar só offline</label>
    </div>
    <div id="lista-etiquetas"></div>
  </div>
</div>

<div id="modal-raiz"></div>

<script src="/app.js"></script>
</body>
</html>
